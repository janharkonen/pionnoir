<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/pion-noir-logo.svg" />
    <title>Pion Noir Oy</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        background: #171717;
        color: #e5e7eb;
        font-family: "Inter", sans-serif;
        line-height: 1.5;
      }

      a { color: inherit; text-decoration: none; }

      .container {
        max-width: 72rem;
        margin: 0 auto;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      header {
        border-bottom: 1px solid #262626;
        background: #262626;
      }

      header .container {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding-top: 1.25rem;
        padding-bottom: 1.25rem;
      }

      header img { display: block; height: 3rem; width: auto; }

      .brand {
        font-family: "Syndication JNL", sans-serif;
        font-size: 1.875rem;
        line-height: 2.25rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #4b5563;
      }

      main {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: calc(100vh - 89px);
        padding-top: 4rem;
        padding-bottom: 4rem;
      }

      .hero { display: flex; flex: 1; align-items: center; }

      h1 {
        max-width: 56rem;
        font-size: 3rem;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #d1d5db;
      }

      .subtitle {
        margin-top: 1.5rem;
        font-size: 1.25rem;
        line-height: 1.75rem;
        color: #a3a3a3;
      }

      footer {
        display: grid;
        gap: 0.75rem;
        padding-top: 4rem;
        font-size: 0.875rem;
        line-height: 1.25rem;
        color: #a3a3a3;
      }

      footer a:hover { color: #fff; }

      @media (min-width: 48rem) {
        h1 { font-size: 4.5rem; }
        .subtitle { font-size: 1.5rem; line-height: 2rem; }
        footer { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <img src="/pion-noir-logo.svg" alt="Pion Noir logo" />
        <a href="/" class="brand">PION NOIR</a>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <div>
          <h1>Pion Noir on holding-yhtiö</h1>
          <p class="subtitle">jonka omistaa Jan Härkönen</p>
        </div>
      </section>

      <footer>
        <a href="https://www.janharkonen.fi">www.janharkonen.fi</a>
        <a href="mailto:jan.harkonen@gmail.com">jan.harkonen@gmail.com</a>
        <a href="tel:+358504646745">+358504646745</a>
        <p>Y-tunnus 3629911-2</p>
      </footer>
    </main>
  </body>
</html>
